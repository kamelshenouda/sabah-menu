<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)">
  <title>قائمة صباح · Sabah Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="wrap">
      <div class="topbar-row">
        <div class="brand" id="brand"></div>
        <div class="topbar-actions">
          <button type="button" class="lang-btn" id="lang-btn"></button>
          <button type="button" class="cart-btn" id="cart-btn"></button>
        </div>
      </div>
      <div id="browse-controls">
        <input type="search" class="search" id="search" autocomplete="off">
        <div class="segmented" id="groups" role="tablist"></div>
        <div class="pills" id="pills"></div>
      </div>
    </div>
  </header>

  <main class="wrap" id="main"></main>

  <div class="fab-wrap" id="fab"></div>
  <div class="sheet-backdrop" id="sheet" hidden></div>
  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="data/menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
